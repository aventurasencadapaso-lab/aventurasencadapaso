<style>#btn-top{position:fixed;bottom:24px;right:24px;z-index:999;width:46px;height:46px;border-radius:50%;background:rgba(28,255,107,.12);border:1px solid rgba(28,255,107,.3);color:#1cff6b;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none;min-height:unset!important;}#btn-top.visible{opacity:1;transform:translateY(0);pointer-events:auto;}#btn-top:hover{background:rgba(28,255,107,.25);}</style>

<body style="background:#02070f;color:#1cff6b;font-family:monospace;padding:20px;">
<h1>Test tiendas.js</h1>
<div id="out">Cargando...</div>
<script src="tiendas.js"></script>
<script>
var out = document.getElementById('out');
if(typeof TIENDAS === 'undefined'){
  out.innerHTML = '<p style="color:red">ERROR: TIENDAS no definido — tiendas.js no cargó</p>';
} else {
  out.innerHTML = '<p style="color:#1cff6b">OK: ' + TIENDAS.length + ' tiendas cargadas</p>'
    + TIENDAS.map(function(t){
        return '<p>' + t.nombre + ' — ' + t.isla + ' — ' + t.tipo + '</p>';
      }).join('');
}
</script>

<div id="cookie-banner" role="dialog" aria-live="polite" aria-label="Aviso de cookies">
 <div class="cookie-banner__inner">
 <div class="cookie-banner__text">
 <p>
 Usamos cookies propias y de terceros (Google Translate) para mejorar tu experiencia.
 Puedes aceptar todas, rechazar las no esenciales o leer más en nuestra
 <a href="politica-cookies.html">Política de Cookies</a> y
 <a href="politica-privacidad.html">Política de Privacidad</a>.
 </p>
 </div>
 <div class="cookie-banner__actions">
 <button id="cookie-accept-all" class="cookie-btn cookie-btn--accept">Aceptar todas</button>
 <button id="cookie-reject" class="cookie-btn cookie-btn--reject">Solo esenciales</button>
 <a href="politica-cookies.html" class="cookie-btn cookie-btn--info">Más info</a>
 </div>
 </div>
</div>

<script>
/* === BANNER DE COOKIES === */
(function () {
 var KEY = 'cookie_consent';
 var banner = document.getElementById('cookie-banner');
 if (!banner) return;

 // Si ya hay consentimiento guardado, ocultar
 if (localStorage.getItem(KEY)) {
 banner.style.display = 'none';
 if (localStorage.getItem(KEY) === 'accepted') loadGoogleTranslate();
 return;
 }

 // Mostrar banner
 banner.style.display = 'block';

 // Aceptar
 var btnAccept = document.getElementById('cookie-accept') ||
 document.getElementById('cookie-accept-all');
 if (btnAccept) {
 btnAccept.addEventListener('click', function () {
 localStorage.setItem(KEY, 'accepted');
 banner.style.display = 'none';
 loadGoogleTranslate();
 });
 }

 // Rechazar
 var btnReject = document.getElementById('cookie-reject');
 if (btnReject) {
 btnReject.addEventListener('click', function () {
 localStorage.setItem(KEY, 'rejected');
 banner.style.display = 'none';
 });
 }

 function loadGoogleTranslate() {
 if (window.googleTranslateLoaded) return;
 window.googleTranslateLoaded = true;
 var s = document.createElement('script');
 s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
 document.head.appendChild(s);
 }
})();
</script>
